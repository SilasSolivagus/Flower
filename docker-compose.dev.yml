services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: flower_admin
      POSTGRES_PASSWORD: flower_admin
      POSTGRES_DB: flower
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flower_admin -d flower"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - flower_dev_pg:/var/lib/postgresql/data
volumes:
  flower_dev_pg: {}
