<text x="84" y="776" font-size="12.5" fill="#111827">edge 以 external 方式挂 123plane_default 网络：123plane 整套 down 并删网络时 edge 起不来，所有域名一起下线。</text>
<circle cx="66" cy="796" r="9" fill="#dc2626"/><text x="66" y="800" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="84" y="800" font-size="12.5" fill="#111827">123plane app 同时是业务服务和 SSO 源：123prd.dirctable.com 用 auth_request 调 app /api/auth/me，wecom-push 未登录也跳 123plane。</text>
<circle cx="66" cy="820" r="9" fill="#dc2626"/><text x="66" y="824" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="84" y="824" font-size="12.5" fill="#111827">prd-cron 通过公网 https://dirctable.com/api/sync/inbound 回写 123plane，两套同源代码之间是双向同步，而非共享一个库。</text>
<circle cx="66" cy="844" r="9" fill="#dc2626"/><text x="66" y="848" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="84" y="848" font-size="12.5" fill="#111827">/opt/scripts/sync-plane-to-push.py 每小时把 123plane 数据推给 wecom-push（SQLite 直写），脚本不在任何仓库。</text>
<circle cx="66" cy="868" r="9" fill="#dc2626"/><text x="66" y="872" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="84" y="872" font-size="12.5" fill="#111827">daily-backup.sh 只覆盖 123plane.db / prd-pg / prd-uploads；hr-postgres、wecom-push data.db、dw.db、onus sqlite 未纳入。</text>
<text x="84" y="896" font-size="12" fill="#6b7280">另：/opt 下只有 edge、wecom-push、b123 有 git remote；其余目录（含 123plane、onus、hr-product、ai-jixiao、silas-site）无远端，靠 scp 部署。</text>
