</defs><rect width="1280" height="900" fill="#ffffff"/>
<text x="40" y="42" font-size="20" font-weight="600" fill="#111827">Flower 目标架构（草案 v0，供讨论）</text>
<text x="40" y="64" font-size="12" fill="#6b7280">一个应用 + 一个 Postgres；所有能力先做成 REST API，MCP 是 API 之上的薄适配层；组织 → 产品两级租户</text>
<rect x="150" y="88" width="220" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="162" y="109" font-size="14" font-weight="600" fill="#111827">产品/研发成员</text>
<text x="162" y="127" font-size="12" fill="#6b7280">浏览器</text>
<rect x="530" y="88" width="220" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="542" y="109" font-size="14" font-weight="600" fill="#111827">外部系统</text>
<text x="542" y="127" font-size="12" fill="#6b7280">API Token · 入站 webhook</text>
<rect x="910" y="88" width="220" height="50" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
